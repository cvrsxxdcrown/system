<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lab5 — LLM Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 12px; }
    textarea { width: 100%; box-sizing: border-box; padding: 10px; }
    button { padding: 10px 16px; cursor: pointer; }
    pre { background: #111; color: #eee; padding: 12px; white-space: pre-wrap; border-radius: 8px; }
    .row { display:flex; gap:10px; align-items:center; margin: 10px 0; flex-wrap: wrap; }
    input { padding: 8px; width: 220px; }
    small { color:#555; }
  </style>
</head>
<body>
  <h2>Лабораторная №5 — Интеграция LLM</h2>
  <p><small>Фронтенд (HTML+JS) отправляет запрос на локальный сервер, который проксирует его в Ollama API.</small></p>

  <div class="row">
    <label>Модель:</label>
    <input id="model" value="gemma3:4b" />
    <label>Температура:</label>
    <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.7" />
  </div>

  <textarea id="prompt" rows="5" placeholder="Введите вопрос..."></textarea>

  <div class="row">
    <button type="button" onclick="sendPrompt()">Отправить</button>
    <span id="status"></span>
  </div>

  <h3>Ответ модели:</h3>
  <pre id="response"></pre>

  <script src="script.js"></script>
</body>
</html>
